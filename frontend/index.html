<!DOCTYPE html>
<html>
  <body>
    <h2>Startup Pitch Uploader</h2>
    <form action="http://127.0.0.1:8000/upload" method="post" enctype="multipart/form-data">
      <label>Company Name:</label>
      <input type="text" name="company_name" required><br><br>

      <label>Pitch Deck (PDF):</label>
      <input type="file" name="pdf_file" accept="application/pdf" required><br><br>

      <label>Pitch Video (MP4):</label>
      <input type="file" name="video_file" accept="video/mp4" required><br><br>

      <input type="submit" value="Upload">
    </form>
  </body>
</html>
